# Reusable: puts an issue on the org board with its fields filled from the form answers, and flags
# missing or invalid answers, a missing parent, a Blocked issue with no "blocked by" link, an
# author never assigned, or Waiting for human with no person assigned with the needs-fields label
# (design 6.6, 6.8; scripts/issue_fields.py). Changes no event reports here (board Status, links,
# assignees, closing a parent early) are caught by the issue-sweep workflow. On a PR event it sets
# the issues the PR closes to In review, and back when it closes unmerged or turns into a draft
# (scripts/pr_status.py). On a new comment, a `Waiting on` line sets Waiting for human and a later
# comment without one takes it back (scripts/comment_status.py). Each keeps the board's Reason field
# (why the item waits on a person, scripts/reason.py) in step.
# In a public repo it acts only for members and the org's bots (scripts/trusted_event.py, design 6.2).
# Every repo (this one included, see issue-fields-caller.yml) calls it with:
#
#   on: { issues: { types: [opened, edited, reopened, typed, untyped] },
#         pull_request_target: { types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed] },
#         issue_comment: { types: [created] } }
#   jobs: { issue-fields: { uses: akenon-studio/.github/.github/workflows/issue-fields.yml@main,
#                           secrets: { AKENON_APP_PRIVATE_KEY: ${{ secrets.AKENON_APP_PRIVATE_KEY }} } } }
#
# It passes only that secret, not `secrets: inherit`, which would hand it every org secret
# (Semgrep's secrets-inherit rule, security-scan / code).
#
# GITHUB_TOKEN cannot write to an org board, so this logs in as the org's GitHub App: org
# variable AKENON_APP_ID and org secret AKENON_APP_PRIVATE_KEY.
name: issue-fields

on:
  workflow_call:
    secrets:
      AKENON_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  # opened and typed arrive together for a new issue; handle them one at a time
  group: issue-fields-${{ github.repository }}-${{ github.event.issue.number || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  # In a public repo, only members' and the org's bots' issues, PRs and comments reach the job that
  # holds the Automation app's key, which reads .github-private (design 6.2). This job holds no
  # secret; an outsider's issue or PR is left alone, and issue-sweep skips it too.
  gate:
    # Renovate's status pages (its dashboard and config-error issue) are not work: no job at all
    # (design 6.8). The titles are rulesets/bots.json's `status_pages`; tests/test_workflows.py
    # checks they match.
    if: >-
      !((github.event.issue.user.login == 'renovate[bot]' ||
         github.event.issue.user.login == 'akenon-studio-renovate[bot]') &&
        (github.event.issue.title == 'Dependency Dashboard' ||
         github.event.issue.title == 'Action Required: Fix Renovate Configuration'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Get the scripts and the team list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          ref: main
          persist-credentials: false

      - name: Members and the org's bots only, in a public repo
        id: check
        run: python3 scripts/trusted_event.py "$GITHUB_EVENT_PATH"

  sync:
    needs: gate  # skipped too when gate is
    if: needs.gate.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the scripts and forms
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          ref: main
          persist-credentials: false

      - name: Log in as the org app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.AKENON_APP_ID }}
          private-key: ${{ secrets.AKENON_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sync the issue to the board, the issues a PR closes, or a comment's status
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          EVENT: ${{ github.event_name }}
        run: |
          pip install --quiet pyyaml
          if [ "$EVENT" = pull_request_target ]; then
            python3 scripts/pr_status.py "$GITHUB_EVENT_PATH"
          elif [ "$EVENT" = issue_comment ]; then
            python3 scripts/comment_status.py "$GITHUB_EVENT_PATH"
          else
            python3 scripts/issue_fields.py "$REPO" "$NUMBER"
          fi
