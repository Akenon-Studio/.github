name: release-decision-caller

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # A comment on a Release PR starts this file on the PR's branch (scripts/release_decision.py).
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write # the comment's run starts this workflow on the Release PR's branch

jobs:
  release-decision:
    uses: ./.github/workflows/release-decision.yml
