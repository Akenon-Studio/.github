name: release-decision-caller

on:
  # _target: main's workflow judges the PR, never the branch's copy (release-decision.yml)
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # A comment on a Release PR re-runs the check on its head (scripts/release_decision.py).
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  actions: write # the comment's run re-runs the check on the Release PR's head

jobs:
  release-decision:
    # a comment on an issue starts no job; the comment's run reports on main, never a PR's head
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: ./.github/workflows/release-decision.yml
