# Reusable: the PR checks every repo runs. Every repo (this one included, see pr-title-caller.yml)
# calls it with:
#
#   on: { pull_request: { types: [opened, edited, synchronize, reopened, assigned, unassigned] } }
#   jobs: { pr-title: { uses: akenon-studio/.github/.github/workflows/pr-title.yml@main } }
#
# A repo Peras delivers to also calls it on `push` (to `main` and `peras/**`) and on
# `workflow_dispatch` with a `sha` input (design 6.3, 7.13 Stage 10): see "Runs that aren't a PR's".
#
# Three jobs, one per thing a check reads (rulesets/required-checks.json marks each, design 7.13
# Stage 10), each with one step per check (design 6.3: billing rounds every job up to a minute).
# Every step runs even when an earlier one fails; the last step fails the job if any blocking step
# failed and lists them all.
# "pr-title / pr" reads the PR, so it runs on a PR only:
#   title: the title is a conventional commit
#   closes-issue: the body closes at least one whole issue (design 6.8; scripts/pr_closes_issue.py)
#   author-assigned: a PR a person opens has its author among the assignees (design 6.8;
#     scripts/pr_author_assigned.py; it reads the assignees from the event, so callers also listen
#     to `assigned` and `unassigned`)
#   stacked: no commit on the branch is on another open PR's branch (handbook#120;
#     scripts/pr_not_stacked.py)
# "pr-title / checks" reads the code:
#   claude-md: every CLAUDE.md passes scripts/claude_md.py (design 6.8)
#   gaming: the change doesn't pass by weakening checks: skipped or focused tests, deleted test
#     files, @ts-ignore, eslint-disable, `any` (design 7.13 stage 6; scripts/gaming_check.py). On a
#     PR it diffs against the PR's base; elsewhere against where the commit left `main` (nothing,
#     on a commit of `main`)
#   docs: every doc is in the fixed map with its owner/covers header, and names only paths, env
#     vars and links that exist (design 6.5; scripts/docs_check.py, rulesets/docs.json)
# "pr-title / docs-tick" is a person's (design 6.5 item 3), so it runs on a PR only:
#   docs-covered: a PR that changes code a doc covers updates the doc or ticks "Still accurate:
#     <doc>" in its body (scripts/docs_covered.py). Advisory while on trial: a failure is a
#     warning, not a failed job (ADVISORY below).
# No run is ever cancelled: an edit or assignment re-runs this on the same commit, and GitHub counts
# a cancelled run there as a failed required check, which blocks the PR. A new step here runs in
# every repo without changing the callers.
#
# Runs that aren't a PR's: GitHub's required-check rule (and Peras with it) reads the newest run of
# a name on a commit, whatever event made it, so a run on a push to a branch other than `main` (a
# Peras branch, the head of its PR) reports "<name> (branch)", and a dispatch, whose runs GitHub
# files under the head of the branch it was dispatched on, "<name> (dispatch)": never a PR's
# required name. A push to `main` keeps the names: no commit of main is a PR's head. A dispatch is
# accepted only on a `peras/**` branch (its code may be unreviewed, and never runs in main's cache
# scope), and checks out the commit its `sha` input names, a full commit; the caller names that commit in its `run-name`, so
# Peras can find the run. A job that runs only on a PR is skipped elsewhere, under such a name off
# main (its id differs from its name, so even an unnamed skip can't pass for it).
name: pr-title

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-checks:
    name: pr${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || github.event_name == 'push' && github.ref_name != 'main' && ' (branch)' || '' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Get the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          # this repo's own PRs test their own version of the scripts; every other repo uses main
          ref: ${{ github.repository == 'akenon-studio/.github' && github.event.pull_request.head.sha || 'main' }}
          path: akenon-github
          persist-credentials: false

      - name: Title is a conventional commit
        id: title
        continue-on-error: true
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)(\([a-z0-9][a-z0-9/-]*\))?!?: [^ ].*'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must be a conventional commit, e.g. 'feat: add pairing screen' or 'fix(api): handle expired tokens'. Got: $TITLE"
            exit 1
          fi

      - name: Body closes at least one whole issue
        id: closes-issue
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }} # a bot's PR: reads its commits
        run: python3 akenon-github/scripts/pr_closes_issue.py

      - name: The author is an assignee
        id: author-assigned
        continue-on-error: true
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 akenon-github/scripts/pr_author_assigned.py

      - name: Not stacked on another open PR
        id: stacked
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 akenon-github/scripts/pr_not_stacked.py

      - name: Result
        env:
          OUTCOMES: >-
            title=${{ steps.title.outcome }}
            closes-issue=${{ steps.closes-issue.outcome }}
            author-assigned=${{ steps.author-assigned.outcome }}
            stacked=${{ steps.stacked.outcome }}
        run: python3 akenon-github/scripts/step_results.py

  checks:
    name: checks${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || github.event_name == 'push' && github.ref_name != 'main' && ' (branch)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: A dispatch runs only on a Peras branch, for a full commit
        # Its code may be unreviewed (a Peras patch), so it never runs in main's cache scope, which
        # every PR reads, and `sha` names a commit, never a branch (design 7.13 Stage 10).
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.event.inputs.sha }}
        run: |
          [[ "$REF" == refs/heads/peras/* ]] || { echo "::error::Dispatch this on a peras/** branch, not $REF"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit, not $SHA"; exit 1; }

      - name: Get the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo
          ref: ${{ github.event.inputs.sha }} # a dispatch's commit; empty: the event's own
          fetch-depth: 0 # gaming diffs against the base, or main off a PR
          persist-credentials: false

      - name: Get the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          # this repo's own PRs test their own version of the scripts; every other repo uses main
          ref: ${{ github.repository == 'akenon-studio/.github' && github.event.pull_request.head.sha || 'main' }}
          path: akenon-github
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: Every CLAUDE.md is capped and every rule has a reason
        id: claude-md
        continue-on-error: true
        run: |
          status=0
          files=$(find repo -name CLAUDE.md -not -path '*/node_modules/*' -not -path '*/.git/*')
          [ -n "$files" ] || echo "No CLAUDE.md in this repo."
          for f in $files; do
            python3 akenon-github/scripts/claude_md.py "$f" --root repo --repo "${GITHUB_REPOSITORY#*/}" || status=1
          done
          exit $status

      - name: Nothing weakens the checks
        id: gaming
        continue-on-error: true
        env:
          # Off a PR, origin/main...HEAD is what the commit adds since it left main: a Peras
          # branch's patch, and nothing on a commit of main.
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python3 akenon-github/scripts/gaming_check.py "$BASE" repo

      - name: Docs are in the map, headed, and name only what exists
        id: docs
        continue-on-error: true
        run: python3 akenon-github/scripts/docs_check.py repo --repo "${GITHUB_REPOSITORY#*/}"

      - name: Result
        env:
          OUTCOMES: >-
            claude-md=${{ steps.claude-md.outcome }}
            gaming=${{ steps.gaming.outcome }}
            docs=${{ steps.docs.outcome }}
        run: python3 akenon-github/scripts/step_results.py

  docs-tick-check:
    name: docs-tick${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || github.event_name == 'push' && github.ref_name != 'main' && ' (branch)' || '' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Get the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo
          fetch-depth: 0 # docs-covered diffs the merge commit against HEAD^1
          persist-credentials: false

      - name: Get the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          # this repo's own PRs test their own version of the scripts; every other repo uses main
          ref: ${{ github.repository == 'akenon-studio/.github' && github.event.pull_request.head.sha || 'main' }}
          path: akenon-github
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: Docs covering the changed code are updated or still accurate
        id: docs-covered
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        # The checkout is the merge commit: its first parent is the base it was merged onto.
        run: python3 akenon-github/scripts/docs_covered.py repo --repo "${GITHUB_REPOSITORY#*/}" --base HEAD^1

      - name: Result
        env:
          OUTCOMES: docs-covered=${{ steps.docs-covered.outcome }}
          ADVISORY: docs-covered
        run: python3 akenon-github/scripts/step_results.py
