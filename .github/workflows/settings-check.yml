# Daily: compares live GitHub settings with rulesets/ (scripts/verify-settings.py) and keeps one
# open `settings-drift` Task issue listing any difference; closes it once everything matches
# (design 6.2). Then keeps one `dependencies` issue listing Dependabot alerts open over 3 days with
# no Renovate PR (scripts/stale_alerts.py, design 6.4); the settings app reads the alerts. Last, keeps
# one `automation-failures` issue listing what failed with no one told: scheduled runs, Renovate's
# problems from its dashboards (whose run-again box it ticks), PRs the merge lane took out and left,
# secret-scanning alerts (scripts/automation_failures.py, design 6.8). The settings app needs
# Actions: read and Secret scanning alerts: read for those; without them the issue says so.
# Reports only: an owner fixes drift by re-running scripts/apply-rules.py.
#
# Reads settings as the read-only "Akenon Studio Settings" app, whose key lives only in this repo's
# `settings-check` environment (deployable from main only): variable SETTINGS_APP_ID, secret
# SETTINGS_APP_PRIVATE_KEY. Files the issue as the automation app (org AKENON_APP_ID /
# AKENON_APP_PRIVATE_KEY), so the issue-fields workflow puts it on the board, assigned to the
# automation owners (rulesets/teams.json).
name: settings-check

on:
  schedule:
    - cron: "0 20 * * *"  # 20:00 UTC, early morning in Australia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: settings-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in as the read-only settings app
        id: settings
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.SETTINGS_APP_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Compare live settings with rulesets/
        id: verify
        env:
          GH_TOKEN: ${{ steps.settings.outputs.token }}
        run: |
          set +e
          python3 scripts/verify-settings.py > verify.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat verify.txt

      - name: Log in as the automation app
        id: automation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.AKENON_APP_ID }}
          private-key: ${{ secrets.AKENON_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
        run: python3 scripts/report_drift.py verify.txt "${{ steps.verify.outputs.code }}"

      # After the drift report, so a failure here can't hide drift.
      - name: List open Dependabot alerts
        env:
          GH_TOKEN: ${{ steps.settings.outputs.token }}
        run: python3 scripts/stale_alerts.py collect alerts.json

      - name: Log in as the automation app, every repo, read-only PRs (to see Renovate's)
        id: pr-read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.AKENON_APP_ID }}
          private-key: ${{ secrets.AKENON_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: read

      - name: Open, update or close the stale-alerts issue
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          PR_READ_TOKEN: ${{ steps.pr-read.outputs.token }}
        run: python3 scripts/stale_alerts.py report alerts.json

      # Last, and whatever happened above, so a failure there can't hide these (design 6.8).
      - name: List failed scheduled runs and secret-scanning alerts
        id: failures
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.settings.outputs.token }}
        run: python3 scripts/automation_failures.py collect failures.json

      - name: Open, update or close the automation failures issue
        if: ${{ !cancelled() && steps.failures.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
        run: python3 scripts/automation_failures.py report failures.json
