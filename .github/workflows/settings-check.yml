# Daily: compares live GitHub settings with rulesets/ (scripts/verify-settings.py) and keeps one
# open `settings-drift` Task issue listing any difference; closes it once everything matches
# (design 6.2). Reports only: an owner fixes drift by re-running scripts/apply-rules.py.
#
# Reads settings as the read-only "Akenon Studio Settings" app, whose key lives only in this repo's
# `settings-check` environment (deployable from main only): variable SETTINGS_APP_ID, secret
# SETTINGS_APP_PRIVATE_KEY. Files the issue as the automation app (org AKENON_APP_ID /
# AKENON_APP_PRIVATE_KEY), so the issue-fields workflow puts it on the board, assigned to the
# automation owners (rulesets/teams.json).
name: settings-check

on:
  schedule:
    - cron: "0 20 * * *"  # 20:00 UTC, early morning in Australia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: settings-check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in as the read-only settings app
        id: settings
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SETTINGS_APP_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Compare live settings with rulesets/
        id: verify
        env:
          GH_TOKEN: ${{ steps.settings.outputs.token }}
        run: |
          set +e
          python3 scripts/verify-settings.py > verify.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat verify.txt

      - name: Log in as the automation app
        id: automation
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AKENON_APP_ID }}
          private-key: ${{ secrets.AKENON_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
        run: python3 scripts/report_drift.py verify.txt "${{ steps.verify.outputs.code }}"
