# Reusable: the `release-decision` check (design 6.3, 6.6, 7.12; scripts/release_decision.py). A
# Release PR (the release app's, on a `release-please--` branch, or labelled `autorelease: pending`)
# passes only once a partner's own comment on it, without the agent marker, is newer than the push
# that made its head commit its head; every other PR passes. A repo with a Release PR calls it with:
#
#   on: { pull_request_target: { types: [opened, synchronize, reopened, labeled, unlabeled] },
#         issue_comment: { types: [created, edited, deleted] } }
#   permissions: { contents: read, pull-requests: read, actions: write }
#   jobs: { release-decision: { if: github.event_name != 'issue_comment' || github.event.issue.pull_request,
#                               uses: akenon-studio/.github/.github/workflows/release-decision.yml@main } }
#
# A called workflow gets no more permission than its caller grants, so the caller grants all three.
# pull_request_target runs main's workflow, not the PR's, so a push to the release branch can't
# change the check that judges it; it checks out no PR code and holds no secret. The required check
# is `release-decision / decision`, reported on the PR's head. A comment's own run (`decision
# (comment)`, on main) re-runs the latest PR run on the head once it has finished, so the comment
# is counted under the required name. One job, never skipped (a skipped job passes a required
# check) and never cancelled; the script comes from main. The script judges a run of this workflow
# the same way if an org ruleset requires it instead of a caller.
name: release-decision

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  actions: write # a comment re-runs the check on the Release PR's head

jobs:
  decision:
    name: decision${{ github.event_name == 'issue_comment' && ' (comment)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get main's script and team list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          ref: main
          persist-credentials: false

      - name: A partner's comment records the decision to cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_decision.py "$GITHUB_EVENT_PATH"
