# Required by the org ruleset "Release decision" in rulesets/org-rulesets.json (design 6.3, 6.4,
# 6.6, 7.12): the `release-decision` check (scripts/release_decision.py). A Release PR (the release
# app's, on a `release-please--` branch, or labelled `autorelease: pending`) passes only once a
# partner's own comment on it, without the agent marker, is newer than the push that made its head
# commit its head; every other PR passes.
#
# The ruleset runs main's copy of this workflow from this repo, and it takes the script and the team
# list from main too, so no repo, branch or PR can change the check that judges it (in this repo,
# GitHub also runs the PR's own copy as an ordinary workflow, which nothing requires). It checks out
# no PR code and holds no secret: only the workflow's read token.
#
# A ruleset's workflow runs only on pull_request events, so a comment (or a label change) re-runs
# this run on the PR's head through release-decision-rerun.yml, which each repo the ruleset names
# calls from main (release-decision-rerun-caller.yml). One job, never skipped (a skipped job passes)
# and never cancelled (a ruleset's workflow may not cancel in progress).
name: release-decision

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get main's script and team list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: akenon-studio/.github
          ref: main
          persist-credentials: false

      # Only the PR that brings the check (.github#248) runs before main has it: then, in this repo
      # only, nothing is judged (the ruleset that requires it is applied after that PR merges).
      - name: A partner's comment records the decision to cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/release_decision.py ] && [ "${GITHUB_REPOSITORY,,}" = "akenon-studio/.github" ]; then
            echo "main has no release_decision.py yet"; exit 0
          fi
          python3 scripts/release_decision.py judge "$GITHUB_EVENT_PATH"
