# After every change on main that peras's agent hooks depend on: run peras's tests
# (core/workspace/tests) against this main, and keep one `peras-tests-broken` issue open while they
# fail (scripts/peras_tests.py, handbook#119). Not a PR check on purpose: reading the private peras
# repo needs the read-only settings app, whose key lives only in the `settings-check` environment,
# which main alone may use; PR code could otherwise print it.
#
# peras is private and this repo public, so its output stays out of this log: the issue, with the
# output's tail, goes in .github-private (members only), and this log and the run's result show only
# whether each step ran, never whether a test failed; a crash shows only its error's type (scripts/
# quiet_run.py; design 6.2, as settings-check.yml does). The tests' exit code reaches the report
# step in a file, since GitHub prints a step's command with its expressions filled in.
#
# Reads peras as the "Akenon Studio Settings" app (Contents: read); files the issue as the automation
# app (org AKENON_APP_ID / AKENON_APP_PRIVATE_KEY), its token limited to .github-private, so the
# issue-fields workflow puts it on the board, assigned to the automation owners.
# A failed run of this workflow (a crash) is listed in the daily automation-failures report
# (scripts/automation_failures.py, AFTER_MAIN; design 6.8): GitHub would email only the pusher.
name: peras-tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "rulesets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peras-tests
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: settings-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: dot-github
          persist-credentials: false

      - name: Log in as the read-only settings app
        id: settings
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.SETTINGS_APP_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: peras

      - name: Get peras
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/peras
          token: ${{ steps.settings.outputs.token }}
          path: peras
          persist-credentials: false

      - name: Install PyYAML (peras's tests need it)
        # By hash, wheels only (the runner's Python 3.12 or 3.13): a later step holds the automation key
        run: |
          pip install --quiet --require-hashes --only-binary :all: -r /dev/stdin <<'REQ'
          pyyaml==6.0.2 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 --hash=sha256:70b189594dbe54f75ab3a1acec5f1e3faa7e8cf2f1e08d9b561cb41b845f69d5
          REQ

      - name: Run peras's agent-hook tests against this main
        env:
          PERAS_DOT_GITHUB: ${{ github.workspace }}/dot-github
        run: |
          set +e
          (cd peras && python3 -m unittest discover -s core/workspace/tests) > tests.txt 2>&1
          # Not the output, nor whether they passed: this log is public and peras private (design 6.2).
          # The code goes to the report step in a file; this step stays green either way.
          echo "$?" > tests.code
          echo "Ran; the result is in .github-private"

      - name: Log in as the automation app
        id: automation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.AKENON_APP_ID }}
          private-key: ${{ secrets.AKENON_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github-private

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
        working-directory: dot-github
        run: python3 scripts/quiet_run.py python3 scripts/peras_tests.py --report ../tests.txt ../tests.code
